name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    env:
      # "latest" installs the newest SwiftLint release on every run. Set a
      # release tag (e.g. "0.59.1") to pin one instead.
      #
      # Note: Xcode's build-tool plugin runs the version pinned in
      # Package.resolved, which can be older than "latest". CI may then flag a
      # rule Xcode never reports; bump the SwiftLint package to close the gap.
      SWIFTLINT_VERSION: latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          base="https://github.com/realm/SwiftLint/releases"
          if [ "$SWIFTLINT_VERSION" = "latest" ]; then
            url="$base/latest/download/portable_swiftlint.zip"
          else
            url="$base/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          fi
          dir="$RUNNER_TEMP/swiftlint"
          mkdir -p "$dir"
          curl -fsSL "$url" -o "$dir/swiftlint.zip"
          unzip -q -o "$dir/swiftlint.zip" -d "$dir"
          chmod +x "$dir/swiftlint"
          installed=$("$dir/swiftlint" version)
          if [ "$SWIFTLINT_VERSION" != "latest" ] && [ "$installed" != "$SWIFTLINT_VERSION" ]; then
            echo "::error::Expected SwiftLint $SWIFTLINT_VERSION, got $installed"
            exit 1
          fi
          echo "Using SwiftLint $installed"
          echo "$dir" >> "$GITHUB_PATH"

      # .swiftlint.yml sits at the repo root and sets `strict: true`, so any
      # warning fails the job. No --config: discovering it from the root is
      # exactly what the Xcode plugin does, so both apply the same rules to
      # every file, app and tests alike.
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Pick whichever iPhone simulator the runner image actually ships, so a
      # runner-image bump doesn't break the build with "device not found".
      - name: Resolve simulator destination
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for rt in sorted(ds) if 'iOS' in rt for d in ds[rt] if d['name'].startswith('iPhone')))")
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # No secrets needed: every test injects a mock through Factory, so
      # nothing here touches the network or needs an API token.
      #
      # -skipPackagePluginValidation: SwiftLintBuildToolPlugin is attached to
      # the app and unit test targets. Xcode requires a build tool plugin to be
      # trusted before first use, which is a GUI prompt — on a runner that
      # surfaces as "Plugin ... must be enabled before it can be used" and
      # fails the build. This is the same problem ci_scripts/ci_post_clone.sh
      # works around for Xcode Cloud, solved per-invocation rather than by
      # writing global Xcode defaults.
      #
      # Linting still happens in the `lint` job above, which runs the swiftlint
      # binary directly and does not depend on the plugin at all.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project iOSSkeletonApp.xcodeproj \
            -scheme iOSSkeletonApp-Dev \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:iOSSkeletonAppTests \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
