name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # .swiftlint.yml sets `strict: true`, so any warning fails the job.
      - name: Run SwiftLint
        run: swiftlint lint --config iOSSkeletonApp/.swiftlint.yml --reporter github-actions-logging

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Pick whichever iPhone simulator the runner image actually ships, so a
      # runner-image bump doesn't break the build with "device not found".
      - name: Resolve simulator destination
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; print(next(d['udid'] for rt in sorted(ds) if 'iOS' in rt for d in ds[rt] if d['name'].startswith('iPhone')))")
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # No secrets needed: every test injects a mock through Factory, so
      # nothing here touches the network or needs an API token.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project iOSSkeletonApp.xcodeproj \
            -scheme iOSSkeletonApp-Dev \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:iOSSkeletonAppTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
